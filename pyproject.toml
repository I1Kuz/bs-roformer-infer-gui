[project]
name = "bs-roformer-infer-gui"
version = "0.1.0"
description = "BS-RoFormer Infer Studio GUI"
readme = "README.md"
requires-python = "==3.12.*"
dependencies = [
    "sv-ttk",
    "pywinstyles",
    "bs-roformer-infer>=0.1.5",
    "torch",
    "torchaudio",
]

[dependency-groups]
dev = [
    "pyinstaller>=6.0.0",
    "basedpyright",
    "ruff",
    "types-PyYAML",
    "pytest>=8.0.0",
]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu124" }
torchaudio = { index = "pytorch-cu124" }

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # Pyflakes
    "I",    # isort
    "UP",   # pyupgrade (modern Python syntax)
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
    "RUF",  # Ruff-specific rules
    "LOG",  # flake8-logging
]
ignore = [
    "E501",   # Line too long (handled by formatter / readability)
    "SIM108", # Use ternary operator instead of if-else (clarity preference)
    "B009",   # Constant getattr for tkinter overload resolution
    "RUF001", # Ambiguous characters (Cyrillic in i18n translations)
    "RUF002", # Ambiguous characters in docstrings
    "RUF003", # Ambiguous characters in comments
]

[tool.ruff.lint.per-file-ignores]
"src/app/main.py" = ["E402"]
"src/app/inference/worker_process.py" = ["E402"]

[tool.ruff.lint.isort]
combine-as-imports = true

[tool.basedpyright]
typeCheckingMode = "strict"
reportMissingImports = "error"
reportMissingTypeStubs = "none"
reportMissingParameterType = "error"
reportUnannotatedClassAttribute = "error"
reportUnusedCallResult = "error"
pythonVersion = "3.12"
pythonPlatform = "Windows"
venvPath = "."
venv = ".venv"
extraPaths = [
    "src",
]
include = [
    "src/app",
]
exclude = [
    "**/tests/**",
    "**/.venv/**",
    "**/__pycache__/**",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

